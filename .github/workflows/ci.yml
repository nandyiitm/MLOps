name: MLOps CI

on:
  pull_request:
    branches: [ main, week2 ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - uses: actions/checkout@v4

      # Step 2: Authenticate with Google Cloud
      - id: 'auth'
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

      # Step 3: Set up Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 4: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc[gcs] pytest cml

      # Step 5: Pull data from DVC remote
      - name: DVC Pull
        run: dvc pull

      # Step 6: Run model script
      - name: Run model training
        run: python script.py

      # Step 7: Run pytest and generate report
      - name: Generate CML report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## MLOps CI Report" > report.md
          echo "### Pytest Results" >> report.md
          echo "\`\`\`" >> report.md
          pytest -sv >> report.md || true
          echo "\`\`\`" >> report.md

          # Post report as a PR comment
          cml comment create report.md
